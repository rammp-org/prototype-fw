## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=5.3'
  espp/esp32-p4-eth: '>=1.0'
  # Local override: carries the fix for the TX frame-lifetime crash (the
  # esp_driver_twai driver reads the queued twai_frame_t from the TX ISR, so
  # transmit() must keep it alive until on_tx_done). Drop the override once an
  # espp/twai release includes it.
  espp/twai:
    version: '>=1.0'
    override_path: '../../../../esp-cpp/espp/components/twai'
  espp/canopen: '>=1.0'
  espp/logger: '>=1.0'
